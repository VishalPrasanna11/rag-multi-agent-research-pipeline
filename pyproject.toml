[project]
name = "earnings-intel"
version = "3.0.0"
description = "Earnings Intelligence Platform: grounded decision intelligence for earnings events"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sse-starlette==3.7.0",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "langgraph==1.2.24",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3",
  "openai==3.57.0",
  "anthropic==2.12.0",
  "httpx==0.28.1",
  "tenacity==9.2.1",
  "structlog==26.1.0",
  "pyjwt[crypto]==2.15.1",
  "itsdangerous==2.2.0",
  "celery[redis]==5.7.0",
  "redis==8.1.0",
  "yfinance==1.8.0",
  "pandas==3.1.1",
  "numpy==2.5.5",
  "lxml==6.1.3",
  "beautifulsoup4==4.15.0",
  "tavily-python==0.8.5",
  "pinecone==10.3.0",
  "opentelemetry-sdk==1.45.2",
  "sentry-sdk==2.75.0",
  "python-multipart==0.0.34",
  "cachetools==8.0.2",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python==5.2.0"]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pytest-timeout==2.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["backend"]
extend-exclude = ["frontend", "backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "B008", "RUF001", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.13"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
