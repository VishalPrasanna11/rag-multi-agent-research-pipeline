# Container stack: one image, two process types. Requires `heroku stack:set container`.
build:
  docker:
    web: Dockerfile
    worker: Dockerfile
run:
  web: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=* --timeout-keep-alive 75
  # exactly one worker runs the beat; scheduled jobs are idempotent per slot even if a beat is duplicated
  worker: celery --workdir backend -A app.jobs worker --beat --loglevel=INFO --concurrency=2
