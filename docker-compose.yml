# Local full stack: API + worker + Postgres + Redis. `docker compose up --build`, then open http://localhost:8000
services:
  api:
    build: .
    env_file: [.env]
    environment:
      ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/earnings_intel
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    env_file: [.env]
    environment:
      ENV: development
      DATABASE_URL: postgresql://postgres:postgres@db:5432/earnings_intel
      REDIS_URL: redis://redis:6379/0
    command: celery --workdir backend -A app.jobs worker --beat --loglevel=INFO --concurrency=2
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  db:
    image: postgres:16.10
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: earnings_intel }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 3s, retries: 20 }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7.4.6-alpine
volumes:
  pgdata:
