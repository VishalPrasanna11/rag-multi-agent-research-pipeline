<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grounded earnings research: every number has a source. Research only, not advice." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Earnings Intelligence</title>
    <script>
      // apply theme before paint (no flash)
      try {
        var t = localStorage.getItem("ei-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.density = localStorage.getItem("ei-density") || "comfortable";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
