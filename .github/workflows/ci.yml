name: ci
on:
  pull_request:
  push:
    branches: [main, upgrade]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: ei_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check backend evals && .venv/bin/ruff format --check backend evals
      - run: .venv/bin/mypy
      - name: tests (sqlite)
        run: .venv/bin/pytest -q
      - name: tests (postgres + migrations)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ei_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ei_test
        run: |
          cd backend && ../.venv/bin/alembic upgrade head && ../.venv/bin/alembic downgrade base && ../.venv/bin/alembic upgrade head && cd ..
          .venv/bin/pytest -q
      - name: fixture-mode evals
        run: .venv/bin/python -m evals.run --fixture --out evals/reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/reports/ci }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.13 && uv pip install -e ".[dev]"
      - run: cd frontend && npm ci && npm run typecheck && npm run lint && npm run build && npm run test:unit
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report }
